name: AI Daily Briefing

on:
  # 스케줄은 외부(cron-job.org)에서 workflow_dispatch API를 호출해 실행 (SCHEDULING.md 참고)
  # GitHub schedule 트리거는 지연/누락이 잦아 사용하지 않음 — 다시 추가하면 실행·메일이 중복됨
  workflow_dispatch:

# 중복 호출 시 동시 실행 방지 (실행 중인 작업은 취소하지 않고 다음 실행을 대기시킴)
concurrency:
  group: daily-briefing
  cancel-in-progress: false

permissions:
  contents: write
  pages: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install anthropic feedparser requests

      - name: Generate briefing
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GCP_TTS_KEY: ${{ secrets.GCP_TTS_KEY }}
        run: python ai_daily_briefing.py

      - name: Copy to docs (GitHub Pages source)
        run: |
          # Jekyll 비활성화
          touch docs/.nojekyll
          # 최신 브리핑을 index.html로 복사
          LATEST=$(ls -t output/ai_briefing_*.html 2>/dev/null | head -1)
          if [ -n "$LATEST" ]; then
            cp "$LATEST" docs/index.html
            # 아카이브도 복사 (날짜별 보관)
            cp output/ai_briefing_*.html docs/ 2>/dev/null || true
            cp output/ai_briefing_*.json docs/ 2>/dev/null || true
            cp output/ai_briefing_*.mp3 docs/ 2>/dev/null || true
            echo "✅ Copied $LATEST to docs/index.html"
          else
            echo "❌ No briefing file found"
            exit 1
          fi

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f docs/
          git diff --cached --quiet || git commit -m "📰 AI Daily Briefing $(TZ=Asia/Seoul date +%Y-%m-%d)"
          git push

      - name: Send email to subscribers
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          python3 send_email.py
